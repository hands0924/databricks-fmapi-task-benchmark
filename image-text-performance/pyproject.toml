[project]
name = "image-text-performance"
version = "0.1.0"
description = "Databricks FMAPI 기반 이미지·텍스트 LLM 성능 벤치마크"
requires-python = ">=3.10"
dependencies = [
    # FMAPI 호출·설정·검증
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    # 데이터셋
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    # 채점 메트릭
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "sacrebleu>=2.4",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.21",
    # 한국어 형태소 토큰화 (시스템 의존성 mecab, mecab-ko-dic 별도 설치 — README 참고)
    "konlpy>=0.6",
    # 문서·표 태스크
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    # 리포트
    "pandas>=2.0",
    "matplotlib>=3.8",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
